{% extends "layout.html" %}
{% block content %}
<h1 class="page-title">판매자 회원가입</h1>
<div class="card" style="max-width:420px;">
  {% if error %}<p class="muted-note" style="color:#dc2626;">{{ error }}</p>{% endif %}
  <form method="post" action="/seller/{{ seller_id }}/signup" style="display:flex;flex-direction:column;gap:12px;">
    <label class="field">아이디
      <input type="text" name="username" value="{{ form.username or '' }}" required>
    </label>
    <label class="field">상호/이름
      <input type="text" name="display_name" value="{{ form.display_name or '' }}" required>
    </label>
    <label class="field">비밀번호
      <input type="password" name="password" required>
    </label>
    <hr style="border-color:var(--border);width:100%;">
    <p class="muted-note">판매자 가입은 국세청 사업자등록 진위확인을 거칩니다.</p>
    <label class="field">사업자등록번호 (숫자 10자리)
      <input type="text" name="business_reg_no" value="{{ form.business_reg_no or '' }}" pattern="[0-9\-]+" required>
    </label>
    <label class="field">개업일자 (YYYYMMDD)
      <input type="text" name="business_open_date" value="{{ form.business_open_date or '' }}" pattern="[0-9]{8}" required>
    </label>
    <label class="field">대표자성명
      <input type="text" name="business_rep_name" value="{{ form.business_rep_name or '' }}" required>
    </label>
    <button class="btn primary block" type="submit">인증하고 가입하기</button>
  </form>
  <p class="muted-note" style="margin-top:12px;">
    이미 계정이 있으신가요? <a href="/seller/{{ seller_id }}/login" style="color:var(--accent);">로그인</a>
  </p>
</div>
{% endblock %}
