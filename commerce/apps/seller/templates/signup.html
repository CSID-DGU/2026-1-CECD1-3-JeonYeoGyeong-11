{% extends "layout.html" %}
{% block content %}
<div class="auth">
  <div class="auth-head">
    <img src="/static/logo.svg" alt="">
    <h1 class="page-title">판매자 가입</h1>
    <p>판매자 가입은 국세청 사업자등록 진위확인을 거칩니다.</p>
  </div>
  <div class="card">
    <form class="form" method="post" action="/seller/{{ seller_id }}/signup">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <label class="field">아이디
        <input type="text" name="username" value="{{ form.username or '' }}" autocomplete="username" required>
      </label>
      <label class="field">상호/이름
        <input type="text" name="display_name" value="{{ form.display_name or '' }}" required>
      </label>
      <label class="field">비밀번호
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <hr class="divider">
      <div class="notice">🔒 입력한 사업자 정보는 진위확인에만 쓰이고, 사업자등록번호만 이 매장 DB에 저장됩니다.</div>
      <label class="field"><span>사업자등록번호 <span class="field-hint">숫자 10자리</span></span>
        <input type="text" name="business_reg_no" value="{{ form.business_reg_no or '' }}" pattern="[0-9\-]+" inputmode="numeric" required>
      </label>
      <div class="form-row">
        <label class="field"><span>개업일자 <span class="field-hint">YYYYMMDD</span></span>
          <input type="text" name="business_open_date" value="{{ form.business_open_date or '' }}" pattern="[0-9]{8}" inputmode="numeric" required>
        </label>
        <label class="field">대표자성명
          <input type="text" name="business_rep_name" value="{{ form.business_rep_name or '' }}" required>
        </label>
      </div>
      <button class="btn primary block" type="submit">인증하고 가입하기</button>
    </form>
  </div>
  <p class="muted-note auth-foot">이미 계정이 있으신가요? <a href="/seller/{{ seller_id }}/login">로그인</a></p>
</div>
{% endblock %}
