{% extends "layout.html" %}
{% block content %}
<h1 class="page-title">상품 등록 / 관리</h1>

<div class="card">
  <h2 class="section-title">새 상품 등록</h2>
  <form method="post" action="/seller/{{ seller_id }}/products" style="display:flex;flex-direction:column;gap:12px;">
    <label class="field">상품명
      <input type="text" name="title_text" required>
    </label>
    <div style="display:flex;gap:12px;">
      <label class="field" style="flex:1">가격(원)
        <input type="number" name="display_price_minor" min="0" required>
      </label>
      <label class="field" style="flex:1">상품 ID (영문/숫자, 예: sku-milk)
        <input type="text" name="item_id_local" pattern="[A-Za-z0-9._-]+" required>
      </label>
    </div>
    <button class="btn primary" type="submit" style="align-self:flex-start;">등록하기</button>
  </form>
</div>

<table>
  <thead>
    <tr><th>상품명</th><th>가격</th><th>상태</th></tr>
  </thead>
  <tbody>
    {% for item in catalog %}
    <tr>
      <td>{{ item.title_text }}</td>
      <td>{{ "{:,}".format(item.display_price_minor) }}원</td>
      <td>
        <span class="badge {{ 'default' if item.listing_status == 'active' else 'muted' }}">
          {{ '판매중' if item.listing_status == 'active' else '중지' }}
        </span>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="muted-note">등록된 상품이 없습니다.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
