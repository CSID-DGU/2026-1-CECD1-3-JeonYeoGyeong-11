{% extends "layout.html" %}
{% block content %}
<h1 class="page-title">고객 쪽지</h1>
<div class="card" style="padding:0;">
  {% for thread in threads %}
  <a class="card" style="display:block;border:none;border-bottom:1px solid var(--border);border-radius:0;"
     href="/seller/{{ seller_id }}/messages/{{ thread.customer_id_local }}">
    <strong>{{ thread.customer_id_local }}</strong>
    <p class="muted-note">{{ '나: ' if thread.last_sender == 'seller' else '' }}{{ thread.last_body }}</p>
  </a>
  {% else %}
  <p class="muted-note" style="padding:16px;">아직 온 쪽지가 없습니다.</p>
  {% endfor %}
</div>
{% endblock %}
