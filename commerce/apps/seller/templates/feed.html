{% extends "layout.html" %}
{% block content %}
<h1 class="page-title">소식 피드 관리</h1>

<div class="card">
  <h2 class="section-title">새 소식 올리기</h2>
  <form method="post" action="/seller/{{ seller_id }}/feed" style="display:flex;flex-direction:column;gap:12px;"><input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
    <div style="display:flex;gap:12px;">
      <label class="field" style="flex:1">종류
        <select name="kind">
          <option value="article">글</option>
          <option value="short_video">숏폼 영상 소개</option>
        </select>
      </label>
      <label class="field" style="flex:2">제목
        <input type="text" name="title" required>
      </label>
    </div>
    <label class="field">내용
      <textarea name="body" rows="3"></textarea>
    </label>
    <p class="muted-note">숏폼은 영상 업로드 대신 소개 글로 대체합니다 (별도 미디어 저장소 미구현).</p>
    <button class="btn primary" type="submit" style="align-self:flex-start;">올리기</button>
  </form>
</div>

{% for post in posts %}
<div class="card">
  <span class="badge {{ 'default' if post.kind == 'short_video' else 'muted' }}">
    {{ '숏폼' if post.kind == 'short_video' else '소식' }}
  </span>
  <h2 class="section-title" style="margin-top:8px;">{{ post.title }}</h2>
  <p>{{ post.body }}</p>
</div>
{% else %}
<p class="muted-note">아직 올린 소식이 없습니다.</p>
{% endfor %}
{% endblock %}
