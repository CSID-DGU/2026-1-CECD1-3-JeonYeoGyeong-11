{% extends "layout.html" %}
{% block content %}
<div class="auth">
  <div class="auth-head">
    <img src="/static/logo.svg" alt="">
    <h1 class="page-title">{{ brand_name }} 판매자센터</h1>
    <p>매장 직원 계정으로 로그인해 주세요.</p>
  </div>
  <div class="card">
    <form class="form" method="post" action="/seller/{{ seller_id }}/login">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <label class="field">아이디
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="field">비밀번호
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary block" type="submit">로그인</button>
    </form>
  </div>
  {% if demo_master %}
  <form class="card demo-login" method="post" action="/seller/{{ seller_id }}/login">
    <input type="hidden" name="username" value="master"><input type="hidden" name="password" value="master-1234">
    <p class="muted-note">시연 모드 · 이 가게의 판매자센터로 바로 들어가요</p>
    <button class="btn secondary block" type="submit">🥒 시연용 마스터 계정으로 로그인</button>
  </form>
  {% endif %}
  <p class="muted-note auth-foot">아직 판매자가 아니신가요? <a href="/seller/{{ seller_id }}/signup">판매자 가입</a></p>
</div>
{% endblock %}
