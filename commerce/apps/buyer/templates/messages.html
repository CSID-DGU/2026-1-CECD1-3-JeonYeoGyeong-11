{% extends "layout.html" %}
{% block content %}
<h1 class="page-title">판매자에게 쪽지 보내기</h1>
<div class="card">
  {% for m in messages %}
  <div class="chat-row {{ 'me' if m.sender == 'customer' else '' }}">
    <div class="chat-bubble {{ 'me' if m.sender == 'customer' else 'them' }}">{{ m.body }}</div>
  </div>
  {% else %}
  <p class="muted-note">아직 대화가 없습니다. 먼저 말을 걸어보세요.</p>
  {% endfor %}
</div>
<form method="post" action="/buyer/{{ seller_id }}/messages" style="display:flex;gap:8px;">
  <input type="text" name="body" placeholder="메시지 입력" required>
  <button class="btn primary" type="submit">전송</button>
</form>
{% endblock %}
