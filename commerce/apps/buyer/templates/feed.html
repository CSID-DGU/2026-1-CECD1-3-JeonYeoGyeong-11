{% extends "layout.html" %}
{% block content %}
<h1 class="page-title">매장 소식</h1>
{% for post in posts %}
<div class="card">
  <span class="badge {{ 'default' if post.kind == 'short_video' else 'muted' }}">
    {{ '숏폼' if post.kind == 'short_video' else '소식' }}
  </span>
  <h2 class="section-title" style="margin-top:8px;">{{ post.title }}</h2>
  {% if post.body %}<p>{{ post.body }}</p>{% endif %}
</div>
{% else %}
<p class="muted-note">아직 올라온 소식이 없습니다.</p>
{% endfor %}
{% endblock %}
